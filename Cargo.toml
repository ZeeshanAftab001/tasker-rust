[package]
name = "tasker"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1.29.2", features = [
    "v4", # Randomly generated UUIDs
    "v7", # Timestamp-based sortable UUIDs
    "serde" # Serialization support
] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
mini-redis = "0.4"

sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres" ,
    "uuid",
    "chrono"
] }
dotenvy = "0.15.7"
